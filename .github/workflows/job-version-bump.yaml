name: Release Manager
# Runs on every push to main, BEFORE the maintainer publishes the GitHub Release.
# Anticipates the next version from release-drafter, bumps the pyproject.toml
# version, writes CHANGELOG.md via the changelog action, and pushes a
# [skip ci] commit so main always carries the prepped version + changelog.
# Nothing tags here - the maintainer publishes the Release manually, which
# creates the tag and triggers the PyPI publish workflow.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  Update_Version:
    name: 🚀 Update Changelog & Prep Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check release prerequisites
        shell: bash
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
        run: |
          if [ -z "$APP_PRIVATE_KEY" ] || [ -z "$APP_CLIENT_ID" ]; then
            echo "::error title=Release setup required::APP_PRIVATE_KEY or RELEASE_APP_CLIENT_ID is not set."
            echo "One-time setup required before the Release Manager works (per repo):"
            echo "  1. Install your release GitHub App on this repository."
            echo "  2. Add the RELEASE_APP_CLIENT_ID variable (the App's Client ID), org or repo level."
            echo "  3. Add the APP_PRIVATE_KEY secret (the App private key), org or repo level."
            echo "  4. Add the release App as a bypass actor on the branch ruleset, so the"
            echo "     [skip ci] changelog push to main is not blocked."
            echo "  Re-check this list whenever the release method is updated."
            exit 1
          fi
          echo "Release prerequisites present."

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.1.1
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: 📂 Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: 📝 Release Drafter (Anticipate Version)
        id: drafter
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-name: release-drafter.yml

      - name: 🔎 Detect releasable changes
        id: releasable
        env:
          BODY: ${{ steps.drafter.outputs.body }}
        run: |
          # release-drafter's body lists the categorized PRs since the last
          # release. With nothing to release (every change excluded, e.g.
          # skip-changelog), it carries no PR entries -- skip the bump/changelog/
          # commit so the manifest stays at the published version instead of
          # drifting ahead.
          if printf '%s' "$BODY" | grep -qE '\(#[0-9]+\)'; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No releasable changes since the last release; skipping the prep commit."
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🔢 Bump Project Version
        if: steps.releasable.outputs.yes == 'true'
        env:
          NEW_VERSION: ${{ steps.drafter.outputs.resolved_version }}
        run: |
          # Bump the first `version = "..."` under [project] in pyproject.toml.
          python - "$NEW_VERSION" <<'PY'
          import re, sys
          new = sys.argv[1]
          p = "pyproject.toml"
          text = open(p, encoding="utf-8").read()
          text, n = re.subn(r'(?m)^version = "[^"]*"', f'version = "{new}"', text, count=1)
          if n != 1:
              sys.exit("could not find a single project version line in pyproject.toml")
          open(p, "w", encoding="utf-8").write(text)
          print(f"pyproject.toml version -> {new}")
          PY

      - name: 📄 Ensure CHANGELOG.md exists
        if: steps.releasable.outputs.yes == 'true'
        run: |
          # The changelog action adds to an existing file; start one on the first release.
          [ -f CHANGELOG.md ] || printf '# Changelog\n\nAll notable changes to this project are documented here.\n' > CHANGELOG.md

      - name: 📤 Run Changelog Action
        if: steps.releasable.outputs.yes == 'true'
        uses: stefanzweifel/changelog-updater-action@a938690fad7edf25368f37e43a1ed1b34303eb36 # v1.12.0
        with:
          latest-version: v${{ steps.drafter.outputs.resolved_version }}
          release-notes: ${{ steps.drafter.outputs.body }}
          path-to-changelog: CHANGELOG.md

      - name: 📤 Commit and Push Version Update
        if: steps.releasable.outputs.yes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(pre-release): v${{ steps.drafter.outputs.resolved_version }} [skip ci]"
          # Commit as the triggering owner, not github-actions[bot]; the push
          # still uses the release App token to bypass the [skip ci] rule.
          commit_user_name: ${{ github.actor }}
          commit_user_email: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
          commit_author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
