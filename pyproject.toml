[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-uploader"
version = "0.1.0"
description = "Browse this server's folders and upload files into any of them"
requires-python = ">=3.12"
dependencies = ["flask>=3.0", "gunicorn>=22"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 110
extend-exclude = ["docs"]

[tool.mypy]
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
